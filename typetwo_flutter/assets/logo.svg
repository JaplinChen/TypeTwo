<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B6AF0"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A5B4FC"/>
      <stop offset="100%" style="stop-color:#C4B5FD"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="120" height="120" rx="26" fill="url(#bg)"/>

  <!-- Left speech bubble (source language) -->
  <rect x="12" y="20" width="54" height="38" rx="9" fill="white" opacity="0.95"/>
  <polygon points="22,58 14,70 34,58" fill="white" opacity="0.95"/>

  <!-- Right speech bubble (target language) -->
  <rect x="54" y="42" width="54" height="38" rx="9" fill="white" opacity="0.30"/>
  <polygon points="88,80 108,80 96,92" fill="white" opacity="0.30"/>

  <!-- Lines inside left bubble (source text) -->
  <rect x="20" y="30" width="30" height="4" rx="2" fill="#5B6AF0" opacity="0.7"/>
  <rect x="20" y="39" width="22" height="4" rx="2" fill="#5B6AF0" opacity="0.5"/>
  <rect x="20" y="48" width="26" height="4" rx="2" fill="#5B6AF0" opacity="0.35"/>

  <!-- Arrow (translation direction) -->
  <path d="M52 61 L68 61" stroke="url(#arrow)" stroke-width="3" stroke-linecap="round"/>
  <path d="M63 55 L70 61 L63 67" stroke="url(#arrow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Lines inside right bubble (translated text) -->
  <rect x="62" y="52" width="30" height="4" rx="2" fill="white" opacity="0.7"/>
  <rect x="62" y="61" width="22" height="4" rx="2" fill="white" opacity="0.5"/>
  <rect x="62" y="70" width="26" height="4" rx="2" fill="white" opacity="0.35"/>

  <!-- "T2" label at bottom -->
  <text x="60" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="white" opacity="0.85" text-anchor="middle" letter-spacing="1">TypeTwo</text>
</svg>
