services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      GLOSSARY_DOMAIN: ${GLOSSARY_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - typetwo_net

  api:
    restart: unless-stopped
    ports: !reset []

  db:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
