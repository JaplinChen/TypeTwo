name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: typetwo
          POSTGRES_USER: typetwo
          POSTGRES_PASSWORD: typetwo-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U typetwo -d typetwo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Backend tests
        shell: bash
        run: python -m pytest backend/tests

      - name: Alembic migration gate
        shell: pwsh
        env:
          DATABASE_URL: postgresql+psycopg://typetwo:typetwo-ci-password@localhost:5432/typetwo
        run: ./scripts/check_backend_migrations.ps1

      - name: Build backend image
        shell: bash
        run: docker compose build api

      - name: Smoke TypeTwo Server
        shell: pwsh
        run: |
          docker compose up -d --build
          try {
            ./scripts/smoke_typetwo_glossary_api.ps1
          } finally {
            docker compose down -v
          }

  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: src/requirements-build.txt

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          cache: true

      - name: Enable Flutter Windows desktop
        shell: powershell
        run: flutter config --enable-windows-desktop

      - name: Install Python test dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r src/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch Flutter dependencies
        shell: powershell
        run: flutter pub get
        working-directory: typetwo_flutter

      - name: Flutter analyze
        shell: powershell
        run: flutter analyze
        working-directory: typetwo_flutter

      - name: Flutter test
        shell: powershell
        run: flutter test
        working-directory: typetwo_flutter

      - name: Python unit tests
        shell: powershell
        run: python -m unittest discover -s src/tests -p "test_*.py" -v

      - name: Verify clipboard hotkey regression
        shell: powershell
        run: |
          $json = .\scripts\verify_hotkey_clipboard_bug.ps1 -AsJson | ConvertFrom-Json
          $json | ConvertTo-Json -Depth 5
          if (-not ($json | Where-Object { $_.OldLogicWouldFail -eq $true })) {
            throw "Expected at least one round where old logic fails."
          }
          foreach ($item in $json) {
            if ($item.NewLogicWouldFail -ne $false) {
              throw "Expected new logic to pass on round $($item.Round)."
            }
          }
