name: CI

on:
  push:
    branches:
      - master
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows-quality:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: src/requirements-build.txt

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Flutter Windows desktop
        shell: powershell
        run: flutter config --enable-windows-desktop

      - name: Install Python test dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r src/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch Flutter dependencies
        shell: powershell
        run: flutter pub get
        working-directory: typetwo_flutter

      - name: Flutter analyze
        shell: powershell
        run: flutter analyze
        working-directory: typetwo_flutter

      - name: Flutter test
        shell: powershell
        run: flutter test
        working-directory: typetwo_flutter

      - name: Python unit tests
        shell: powershell
        run: python -m unittest discover -s src/tests -p "test_*.py" -v

      - name: Verify clipboard hotkey regression
        shell: powershell
        run: |
          $json = .\scripts\verify_hotkey_clipboard_bug.ps1 -AsJson | ConvertFrom-Json
          $json | ConvertTo-Json -Depth 5
          if (-not ($json | Where-Object { $_.OldLogicWouldFail -eq $true })) {
            throw "Expected at least one round where old logic fails."
          }
          foreach ($item in $json) {
            if ($item.NewLogicWouldFail -ne $false) {
              throw "Expected new logic to pass on round $($item.Round)."
            }
          }
