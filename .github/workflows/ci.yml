name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  windows-quality:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: src/requirements-build.txt

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Flutter Windows desktop
        shell: powershell
        run: flutter config --enable-windows-desktop

      - name: Install Python test dependencies
        shell: powershell
        run: python -m pip install --upgrade pip && pip install -r src/requirements-build.txt

      - name: Fetch Flutter dependencies
        shell: powershell
        run: flutter pub get
        working-directory: typetwo_flutter

      - name: Flutter analyze
        shell: powershell
        run: flutter analyze
        working-directory: typetwo_flutter

      - name: Flutter test
        shell: powershell
        run: flutter test
        working-directory: typetwo_flutter

      - name: Python unit tests
        shell: powershell
        run: python -m unittest discover -s src/tests -p "test_*.py" -v
