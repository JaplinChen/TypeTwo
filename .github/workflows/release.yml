name: Release Windows Installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Enable Flutter Windows desktop
        shell: powershell
        run: flutter config --enable-windows-desktop

      - name: Fetch Flutter dependencies
        shell: powershell
        run: flutter pub get
        working-directory: typetwo_flutter

      - name: Install Python build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r src/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Flutter analyze
        shell: powershell
        run: flutter analyze
        working-directory: typetwo_flutter

      - name: Flutter test
        shell: powershell
        run: flutter test
        working-directory: typetwo_flutter

      - name: Python unit tests
        shell: powershell
        run: python -m unittest discover -s src/tests -p "test_*.py" -v

      - name: Build installer
        shell: cmd
        run: build_all.bat skip

      - name: Smoke test packaged executables
        shell: powershell
        run: .\scripts\package_smoke_test.ps1 -StrictCleanup

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup_typetwo
          path: installer/output/setup_typetwo.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/setup_typetwo.exe
