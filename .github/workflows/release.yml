name: Release TypeTwo Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-image-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image version
        id: version
        shell: bash
        run: |
          if [ -n "${GITHUB_REF_NAME}" ]; then
            raw="${GITHUB_REF_NAME}"
          else
            raw="manual-${GITHUB_RUN_NUMBER}"
          fi
          safe="$(echo "$raw" | tr '/' '-' | tr -cd 'A-Za-z0-9_.-')"
          echo "value=${safe}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        shell: bash
        run: |
          docker build \
            -t typetwo-glossary-api:${{ github.sha }} \
            -t typetwo-glossary-api:${{ steps.version.outputs.value }} \
            ./backend

      - name: Export backend image
        shell: bash
        run: |
          docker save typetwo-glossary-api:${{ steps.version.outputs.value }} \
            -o typetwo-glossary-api-${{ steps.version.outputs.value }}.tar
          sha256sum typetwo-glossary-api-${{ steps.version.outputs.value }}.tar \
            > typetwo-glossary-api-${{ steps.version.outputs.value }}.tar.sha256

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: typetwo-glossary-api-${{ steps.version.outputs.value }}
          path: |
            typetwo-glossary-api-${{ steps.version.outputs.value }}.tar
            typetwo-glossary-api-${{ steps.version.outputs.value }}.tar.sha256
          if-no-files-found: error

      - name: Attach backend image to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            typetwo-glossary-api-${{ steps.version.outputs.value }}.tar
            typetwo-glossary-api-${{ steps.version.outputs.value }}.tar.sha256

  build-windows-installer:
    # ponytail: windows-latest image dropped the VS toolchain Flutter 3.32 expects; unpin after upgrading Flutter
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Enable Flutter Windows desktop
        shell: powershell
        run: flutter config --enable-windows-desktop

      - name: Fetch Flutter dependencies
        shell: powershell
        run: flutter pub get
        working-directory: typetwo_flutter

      - name: Install Python build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r src/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Flutter analyze
        shell: powershell
        run: flutter analyze
        working-directory: typetwo_flutter

      - name: Flutter test
        shell: powershell
        run: flutter test
        working-directory: typetwo_flutter

      - name: Python unit tests
        shell: powershell
        run: python -m unittest discover -s src/tests -p "test_*.py" -v

      - name: Build installer
        shell: cmd
        run: build_all.bat skip

      - name: Smoke test packaged executables
        shell: powershell
        run: .\scripts\package_smoke_test.ps1 -StrictCleanup

      - name: Generate installer checksum
        shell: powershell
        run: |
          $installer = 'installer/output/setup_typetwo.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash.ToLowerInvariant()
          "$hash  setup_typetwo.exe" | Set-Content -Encoding ascii installer/output/setup_typetwo.exe.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup_typetwo
          path: |
            installer/output/setup_typetwo.exe
            installer/output/setup_typetwo.exe.sha256
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/output/setup_typetwo.exe
            installer/output/setup_typetwo.exe.sha256
